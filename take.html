<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --green:#0b5830; --green2:#107c41; --bg:#f6fbf8; --cream:#f5f0e1; --red:#c81e1e; --ink:#1c2b23; --gold:#d9a400; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:linear-gradient(180deg,#eef7f1,#f6fbf8); color:var(--ink); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  header { text-align:center; padding:22px 0 8px; position:relative; }
  header .logo { display:inline-block; background:var(--green); color:var(--cream); padding:8px 26px; border-radius:40px; font-weight:bold; font-size:24px; letter-spacing:.5px; }
  header .sub { color:#5a6b60; margin-top:8px; font-size:14px; }
  .mute { position:absolute; left:0; top:24px; background:#fff; border:2px solid #dce9e0; border-radius:50%; width:42px; height:42px; font-size:19px; cursor:pointer; }
  .card { background:#fff; border-radius:18px; box-shadow:0 4px 18px rgba(11,88,48,.08); padding:26px 22px; margin-top:20px; }
  input[type=text] { width:100%; padding:12px 14px; border:2px solid #dce9e0; border-radius:12px; font-size:16px; font-family:inherit; background:var(--bg); }
  input:focus { outline:none; border-color:var(--green2); }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .pill { background:var(--bg); border:2px solid #dce9e0; border-radius:30px; padding:6px 14px; font-size:15px; font-weight:bold; color:var(--green); white-space:nowrap; }
  .pill.streak { color:#c25e00; border-color:#f0dcb8; background:#fff8e8; }
  .pill.streak.zero { visibility:hidden; }
  .pill.timer { min-width:64px; text-align:center; transition:.2s; }
  .pill.timer.low { color:var(--red); border-color:var(--red); background:#fbeaea; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  .bar { height:8px; background:#e4efe8; border-radius:6px; overflow:hidden; margin-bottom:18px; }
  .bar div { height:100%; background:var(--green2); width:0%; transition:width .3s; }
  .q { font-size:19px; font-weight:bold; line-height:1.7; margin-bottom:16px; }
  .opt { display:block; width:100%; text-align:right; background:var(--bg); border:2px solid #dce9e0; border-radius:12px; padding:14px 16px; margin-top:10px; cursor:pointer; font-size:16px; line-height:1.6; transition:.15s; font-family:inherit; }
  .opt:hover:not(:disabled) { border-color:var(--green2); }
  .opt:disabled { cursor:default; opacity:.9; }
  .opt.right { background:#e6f6ec; border-color:var(--green2); color:var(--green); font-weight:bold; }
  .opt.wrong { background:#fbeaea; border-color:var(--red); color:var(--red); }
  .gain { text-align:center; font-size:22px; font-weight:bold; color:var(--green2); margin-top:14px; min-height:30px; animation:pop .35s; }
  @keyframes pop { 0% { transform:scale(.5); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  .why { display:none; margin-top:14px; background:#fff8e8; border-right:4px solid var(--gold); border-radius:10px; padding:14px 16px; font-size:15px; line-height:1.8; }
  .why.show { display:block; }
  .why b { color:#8a6500; }
  .next, .btn { width:100%; margin-top:16px; background:var(--green); color:#fff; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; }
  .next { display:none; }
  .next.show { display:block; }
  .score-big { font-size:52px; font-weight:bold; color:var(--green); text-align:center; }
  .score-label { text-align:center; color:#5a6b60; font-size:14px; margin-top:2px; }
  .stats { display:flex; gap:10px; margin:18px 0 4px; }
  .stat { flex:1; background:var(--bg); border-radius:12px; padding:12px 8px; text-align:center; }
  .stat b { display:block; font-size:20px; color:var(--green); }
  .stat span { font-size:12px; color:#5a6b60; }
  .score-sub { text-align:center; color:#5a6b60; margin:12px 0 4px; font-size:16px; }
  .muted { color:#8a9a90; font-size:13px; text-align:center; margin-top:16px; }
  .err { background:#fbeaea; color:var(--red); border-radius:10px; padding:12px; margin-top:14px; font-size:14px; display:none; }
  footer { text-align:center; color:#8a9a90; font-size:13px; margin-top:30px; padding-bottom:20px; }
  .mrow { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .mrow .ml { flex:1.2; min-width:0; overflow-wrap:anywhere; background:var(--bg); border:2px solid #dce9e0; border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.5; }
  .mrow select { flex:1; min-width:0; width:100%; max-width:100%; padding:12px 10px; border:2px solid #dce9e0; border-radius:12px; font-size:15px; font-family:inherit; background:#fff; }
  .mrow.good .ml { border-color:var(--green2); background:#e6f6ec; }
  .mrow.bad .ml { border-color:var(--red); background:#fbeaea; }
  .orow { display:flex; gap:8px; align-items:center; margin-top:10px; background:var(--bg); border:2px solid #dce9e0; border-radius:12px; padding:10px 12px; }
  .orow .ot { flex:1; font-size:15px; line-height:1.5; }
  .orow .obtns { display:flex; flex-direction:column; gap:2px; }
  .orow .obtns button { border:1px solid #dce9e0; background:#fff; border-radius:8px; width:34px; height:22px; cursor:pointer; font-size:12px; color:var(--green); line-height:1; }
  .orow.good { border-color:var(--green2); background:#e6f6ec; }
  .orow.bad { border-color:var(--red); background:#fbeaea; }
  .fillin { width:100%; margin-top:14px; padding:14px 16px; border:2px solid #dce9e0; border-radius:12px; font-size:16px; font-family:inherit; background:var(--bg); }
  .fillin.good { border-color:var(--green2); background:#e6f6ec; }
  .fillin.bad { border-color:var(--red); background:#fbeaea; }
  .confirm { width:100%; margin-top:14px; background:var(--green2); color:#fff; border:0; border-radius:12px; padding:13px; font-size:16px; font-weight:bold; cursor:pointer; font-family:inherit; }
@media(max-width:540px) { .mrow { flex-direction:column; align-items:stretch; gap:6px; margin-top:14px; } .mrow .ml { padding:9px 12px; } .mrow select { flex:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="mute" id="mutebtn" onclick="toggleMute()" title="الصوت">🔊</button>
    <span class="logo">تحدي 🎯</span>
    <div class="sub" id="qtitle">اختبار</div>
  </header>

  <div class="card" id="nameCard">
    <p style="font-size:16px;margin-bottom:12px;">اكتب اسمك ليبدأ التحدي:</p>
    <input type="text" id="sname" placeholder="اسمك">
    <button class="btn" onclick="begin()">ابدأ 🎮</button>
    <div class="err" id="nameErr"></div>
  </div>

  <div class="card" id="quiz" style="display:none;">
    <div class="hud">
      <span class="pill" id="scorepill">⭐ 0</span>
      <span class="pill streak zero" id="streakpill">🔥 ×0</span>
      <span class="pill timer" id="timerpill">الوقت: ٢٠ ثانية</span>
    </div>
    <div class="meta" style="display:flex;justify-content:space-between;color:#5a6b60;font-size:13px;margin-bottom:10px;"><span id="counter"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="gain" id="gain"></div>
    <div class="why" id="why"></div>
    <button class="next" id="nextbtn" onclick="next()"></button>
  </div>

  <div class="card" id="result" style="display:none;">
    <div class="score-big" id="scorenum"></div>
    <div class="score-label">نقطة</div>
    <div class="stats">
      <div class="stat"><b id="rcorrect"></b><span>إجابات صحيحة</span></div>
      <div class="stat"><b id="rbest"></b><span>أطول سلسلة 🔥</span></div>
      <div class="stat"><b id="rtime"></b><span>الوقت</span></div>
    </div>
    <div class="score-sub" id="scoremsg"></div>
    <p class="muted">تم إرسال نتيجتك لمدربك. شكرًا لك 🎯</p>
  </div>

  <div class="card" id="bad" style="display:none;">
    <p>الرابط غير صحيح أو الاختبار غير موجود. تأكد من نسخ الرابط كاملًا.</p>
  </div>
</div>

<script>
const SUPA_URL = 'https://vgvkbsnpdpgybtsfwted.supabase.co';
const SUPA_KEY = 'sb_publishable_v3QgxU-WmX2vOPmIr1vJZw_qaGTHVvg';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
const quizId = new URLSearchParams(location.search).get('quiz');
const QTIME = 20;
let quiz = null, qs = [], i = 0, correct = 0, points = 0, streak = 0, bestStreak = 0, t0 = 0, student = '';
let timeLeft = QTIME, timerId = null, answered = false;

// ===== sound (Web Audio, unlocked on first tap) =====
let AC = null, muted = false;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, delay) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  const t = ac.currentTime + (delay || 0);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.22, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sCorrect = () => {
  [523, 659, 784, 1047].forEach((f, k) => { tone(f, .16, 'triangle', .26, k * .09); tone(f * 2, .1, 'sine', .07, k * .09); });
  tone(1568, .35, 'sine', .1, .42);
};
const sWrong = () => { tone(180, .25, 'sawtooth', .18); tone(140, .3, 'sawtooth', .15, .1); };
const sTick = () => tone(1050, .05, 'square', .08);
const sStreak = () => { [523, 659, 784, 1047, 1319].forEach((f, k) => { tone(f, .14, 'triangle', .24, k * .08); tone(f * 2, .09, 'sine', .06, k * .08); }); };
const sFinish = () => { [523, 659, 784, 1047].forEach((f, k) => tone(f, .18, 'triangle', .24, k * .14)); };
// خلفية محفزة هادية أثناء السؤال
let bgId = null, bgStep = 0;
const BGNOTES = [523, 659, 784, 659, 587, 740, 880, 740];
function startBg() {
  stopBg();
  if (muted) return;
  bgStep = 0;
  bgId = setInterval(() => {
    if (muted) return;
    const f = BGNOTES[bgStep % BGNOTES.length];
    tone(f, .2, 'triangle', .026);
    if (bgStep % 2 === 0) tone(f / 2, .32, 'sine', .018);
    bgStep++;
  }, 460);
}
function stopBg() { if (bgId) { clearInterval(bgId); bgId = null; } }
function toggleMute() { muted = !muted; document.getElementById('mutebtn').textContent = muted ? '🔇' : '🔊'; }

function shuffle(a) { a = a.slice(); for (let j = a.length - 1; j > 0; j--) { const k = Math.floor(Math.random() * (j + 1)); [a[j], a[k]] = [a[k], a[j]]; } return a; }
async function load() {
  if (!quizId) { document.getElementById('nameCard').style.display = 'none'; return document.getElementById('bad').style.display = ''; }
  const rq = await supa.from('quizzes').select('*').eq('id', quizId).single();
  if (rq.error || !rq.data) { document.getElementById('nameCard').style.display = 'none'; return document.getElementById('bad').style.display = ''; }
  quiz = rq.data;
  document.getElementById('qtitle').textContent = quiz.title;
  document.title = quiz.title + ' — تحدي';
  const rs = await supa.from('questions').select('*').eq('quiz_id', quizId).order('ord');
  qs = shuffle(rs.data || []).map(q => {
    const type = q.type || 'mcq';
    if (type === 'match') {
      const rights = (q.right_items || []).map((t, idx) => ({ t, idx }));
      return { ...q, _rights: shuffle(rights) };
    }
    if (type === 'order') {
      const items = (q.order_items || []).map((t, idx) => ({ t, idx }));
      return { ...q, _disp: shuffle(items) };
    }
    if (type === 'tf' || type === 'fill') return { ...q };
    const order = shuffle(q.o.map((_, idx) => idx));
    return { ...q, o: order.map(idx => q.o[idx]), a: order.indexOf(q.a) };
  });
  if (!qs.length) { document.getElementById('nameCard').style.display = 'none'; return document.getElementById('bad').style.display = ''; }
}
function begin() {
  student = document.getElementById('sname').value.trim();
  if (!student) { const e = document.getElementById('nameErr'); e.textContent = 'اكتب اسمك أولًا.'; e.style.display = 'block'; return; }
  audio(); // unlock sound on first tap
  t0 = Date.now();
  document.getElementById('nameCard').style.display = 'none';
  show('quiz'); render();
}
function show(id) { ['quiz', 'result'].forEach(x => document.getElementById(x).style.display = x === id ? '' : 'none'); }
function hud() {
  document.getElementById('scorepill').textContent = '⭐ ' + points;
  const sp = document.getElementById('streakpill');
  sp.textContent = '🔥 ×' + streak;
  sp.classList.toggle('zero', streak < 2);
}
function qTime(q) { return (q.type === 'match' || q.type === 'order') ? 45 : (q.type === 'fill' ? 30 : QTIME); }
function startTimer() {
  clearInterval(timerId);
  timeLeft = qTime(qs[i]);
  const tp = document.getElementById('timerpill');
  tp.textContent = 'الوقت: ' + timeLeft.toLocaleString('ar-EG') + ' ثانية'; tp.classList.remove('low');
  timerId = setInterval(() => {
    timeLeft--;
    tp.textContent = 'الوقت: ' + Math.max(timeLeft, 0).toLocaleString('ar-EG') + ' ثانية';
    if (timeLeft <= 5) { tp.classList.add('low'); if (timeLeft > 0) sTick(); }
    if (timeLeft <= 0) { clearInterval(timerId); timeout(); }
  }, 1000);
}
function render() {
  const q = qs[i];
  answered = false;
  document.getElementById('counter').textContent = 'سؤال ' + (i + 1) + ' من ' + qs.length;
  document.getElementById('prog').style.width = (i / qs.length * 100) + '%';
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('gain').textContent = '';
  hud();
  const box = document.getElementById('opts');
  box.innerHTML = '';
  if (q.type === 'match') {
    (q.left_items || []).forEach((lt, k) => {
      const row = document.createElement('div');
      row.className = 'mrow';
      row.innerHTML = '<div class="ml"></div>';
      row.querySelector('.ml').textContent = lt;
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">اختر المقابل…</option>' + q._rights.map(r => '<option value="' + r.idx + '"></option>').join('');
      [...sel.querySelectorAll('option')].slice(1).forEach((o, k2) => o.textContent = q._rights[k2].t);
      sel.id = 'msel' + k;
      row.appendChild(sel);
      box.appendChild(row);
    });
    const cb = document.createElement('button');
    cb.className = 'confirm'; cb.textContent = 'تأكيد التوصيل';
    cb.onclick = () => settleMatch(false);
    box.appendChild(cb);
  } else if (q.type === 'fill') {
    const row = document.createElement('div');
    row.innerHTML = '<input type="text" id="fillIn" class="fillin" placeholder="اكتب الكلمة أو المعلومة الناقصة هنا" autocomplete="off">';
    box.appendChild(row);
    const cb = document.createElement('button');
    cb.className = 'confirm'; cb.textContent = 'تأكيد الإجابة';
    cb.onclick = () => settleFill(false);
    box.appendChild(cb);
    setTimeout(() => { const f = document.getElementById('fillIn'); if (f) f.focus(); }, 50);
    row.querySelector('#fillIn').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') settleFill(false); });
  } else if (q.type === 'order') {
    renderOrderList(q, box);
    const cb = document.createElement('button');
    cb.className = 'confirm'; cb.textContent = 'تأكيد الترتيب';
    cb.onclick = () => settleOrder(false);
    box.appendChild(cb);
  } else {
    q.o.forEach((t, idx) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = t;
      b.onclick = () => answer(idx, b);
      box.appendChild(b);
    });
  }
  const why = document.getElementById('why');
  why.className = 'why'; why.innerHTML = '';
  document.getElementById('nextbtn').className = 'next';
  startTimer();
  startBg();
}
function settle(idx, btn, timedOut) {
  if (answered) return;
  answered = true;
  clearInterval(timerId);
  stopBg();
  const q = qs[i];
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach(o => o.disabled = true);
  opts[q.a].classList.add('right');
  let head;
  if (!timedOut && idx === q.a) {
    correct++;
    const gained = 100 + timeLeft * 5 + streak * 20;
    points += gained;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    document.getElementById('gain').textContent = '+' + gained;
    head = '✅ إجابة صحيحة!';
    if (streak >= 3) { head += ' سلسلة 🔥×' + streak; sStreak(); } else sCorrect();
  } else {
    if (!timedOut && btn) btn.classList.add('wrong');
    streak = 0;
    head = timedOut ? '⏰ انتهى الوقت! الصحيح: «' + q.o[q.a] + '»' : '❌ إجابة غير صحيحة. الصحيح: «' + q.o[q.a] + '»';
    sWrong();
  }
  const why = document.getElementById('why');
  why.innerHTML = '<b>' + head + '</b>' + (q.e ? '<br>' + q.e : '');
  why.classList.add('show');
  hud();
  const nb = document.getElementById('nextbtn');
  nb.textContent = (i + 1 < qs.length) ? 'السؤال التالي' : 'عرض النتيجة 🏁';
  nb.classList.add('show');
}
function renderOrderList(q, box) {
  [...box.querySelectorAll('.orow')].forEach(x => x.remove());
  const cb = box.querySelector('.confirm');
  q._disp.forEach((it, pos) => {
    const row = document.createElement('div');
    row.className = 'orow';
    row.innerHTML = '<div class="ot"></div><div class="obtns"><button type="button" title="أعلى">▲</button><button type="button" title="أسفل">▼</button></div>';
    row.querySelector('.ot').textContent = (pos + 1) + '. ' + it.t;
    const [up, dn] = row.querySelectorAll('button');
    up.onclick = () => { if (pos > 0) { const t = q._disp[pos - 1]; q._disp[pos - 1] = q._disp[pos]; q._disp[pos] = t; renderOrderList(q, box); } };
    dn.onclick = () => { if (pos < q._disp.length - 1) { const t = q._disp[pos + 1]; q._disp[pos + 1] = q._disp[pos]; q._disp[pos] = t; renderOrderList(q, box); } };
    box.insertBefore(row, cb);
  });
}
function finishTyped(ok, correctHtml) {
  answered = true;
  clearInterval(timerId);
  stopBg();
  const q = qs[i];
  let head;
  if (ok) {
    correct++;
    const gained = 100 + timeLeft * 5 + streak * 20;
    points += gained;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    document.getElementById('gain').textContent = '+' + gained;
    head = '✅ إجابة صحيحة!';
    if (streak >= 3) { head += ' سلسلة 🔥×' + streak; sStreak(); } else sCorrect();
  } else {
    streak = 0;
    head = '❌ إجابة غير صحيحة.';
    sWrong();
  }
  const why = document.getElementById('why');
  why.innerHTML = '<b>' + head + '</b><br>' + correctHtml + (q.e ? '<br>' + q.e : '');
  why.classList.add('show');
  hud();
  const nb = document.getElementById('nextbtn');
  nb.textContent = (i + 1 < qs.length) ? 'السؤال التالي' : 'عرض النتيجة 🏁';
  nb.classList.add('show');
}
function normTxt(s) {
  return (s || '').trim()
    .replace(/[\u064B-\u0652\u0670]/g, '')
    .replace(/[\u0623\u0625\u0622]/g, '\u0627')
    .replace(/\u0629/g, '\u0647')
    .replace(/\u0649/g, '\u064A')
    .replace(/\u0640/g, '')
    .replace(/\s+/g, ' ')
    .toLowerCase();
}
function settleFill(timedOut) {
  if (answered) return;
  const q = qs[i];
  const inp = document.getElementById('fillIn');
  const expected = (q.o || [])[q.a] || '';
  const ok = !timedOut && inp && normTxt(inp.value) !== '' && normTxt(inp.value) === normTxt(expected);
  if (inp) { inp.disabled = true; inp.classList.add(ok ? 'good' : 'bad'); }
  const cb = document.querySelector('#opts .confirm'); if (cb) cb.disabled = true;
  const correctHtml = 'الإجابة الصحيحة: «' + expected + '»';
  finishTyped(ok, correctHtml);
}
function settleMatch(timedOut) {
  if (answered) return;
  const q = qs[i];
  let ok = !timedOut;
  (q.left_items || []).forEach((lt, k) => {
    const sel = document.getElementById('msel' + k);
    const good = !timedOut && sel.value !== '' && parseInt(sel.value) === k;
    sel.disabled = true;
    sel.parentElement.classList.add(good ? 'good' : 'bad');
    if (!good) ok = false;
  });
  const cb = document.querySelector('#opts .confirm'); if (cb) cb.disabled = true;
  const correctHtml = 'التوصيل الصحيح:<br>' + (q.left_items || []).map((lt, k) => '• ' + lt + ' ← ' + (q.right_items || [])[k]).join('<br>');
  finishTyped(ok, correctHtml);
}
function settleOrder(timedOut) {
  if (answered) return;
  const q = qs[i];
  let ok = !timedOut;
  q._disp.forEach((it, pos) => {
    if (it.idx !== pos) ok = false;
  });
  [...document.querySelectorAll('#opts .orow')].forEach((row, pos) => {
    row.classList.add(q._disp[pos].idx === pos ? 'good' : 'bad');
    row.querySelectorAll('button').forEach(b => b.disabled = true);
  });
  const cb = document.querySelector('#opts .confirm'); if (cb) cb.disabled = true;
  const correctHtml = 'الترتيب الصحيح:<br>' + (q.order_items || []).map((t, k) => (k + 1) + '. ' + t).join('<br>');
  finishTyped(ok, correctHtml);
}
function answer(idx, btn) { settle(idx, btn, false); }
function timeout() {
  const q = qs[i];
  if (q && q.type === 'fill') return settleFill(true);
  if (q && q.type === 'match') return settleMatch(true);
  if (q && q.type === 'order') return settleOrder(true);
  settle(-1, null, true);
}
async function next() {
  if (i + 1 < qs.length) { i++; render(); return; }
  document.getElementById('prog').style.width = '100%';
  const seconds = Math.round((Date.now() - t0) / 1000);
  document.getElementById('scorenum').textContent = points;
  document.getElementById('rcorrect').textContent = correct + '/' + qs.length;
  document.getElementById('rbest').textContent = '×' + bestStreak;
  document.getElementById('rtime').textContent = seconds + ' ث';
  const p = correct / qs.length;
  let m;
  if (p >= .9) m = 'أسطوري! 🏆';
  else if (p >= .7) m = 'أداء قوي 💪';
  else if (p >= .5) m = 'أساس كويس — راجع الشروحات 📚';
  else m = 'حاول مرة أخرى بعد المراجعة 🔁';
  document.getElementById('scoremsg').textContent = m;
  show('result');
  sFinish();
  await supa.from('attempts').insert({ quiz_id: quizId, student_name: student, score: correct, total: qs.length, seconds });
}
load();
